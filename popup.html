<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HN Companion</title>
    <style>
        body {
            margin: 0;
            padding: 12px 14px;
            min-width: 280px;
            max-width: 320px;
            font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #222;
        }
        h1 {
            margin: 0 0 8px;
            font-size: 14px;
            font-weight: 600;
        }
        p {
            margin: 0 0 10px;
            color: #555;
        }
        .meta {
            font-size: 11px;
            color: #888;
            margin-bottom: 10px;
            word-break: break-all;
        }
        button {
            display: block;
            width: 100%;
            margin-top: 8px;
            padding: 8px 10px;
            border: none;
            border-radius: 6px;
            background: #ff6600;
            color: #fff;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }
        button:hover {
            background: #e55a00;
        }
        button.secondary {
            background: #f3f4f6;
            color: #333;
        }
        button.secondary:hover {
            background: #e5e7eb;
        }
        button:disabled {
            opacity: 0.6;
            cursor: default;
        }
        .status-ok { color: #15803d; }
        .status-warn { color: #b45309; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <h1 id="title">HN Companion</h1>
    <p id="message">Checking current tab…</p>
    <div id="meta" class="meta hidden"></div>
    <button id="enable-btn" class="hidden">Enable on this site</button>
    <button id="options-btn" class="secondary hidden">Manage enabled sites</button>
    <script src="popup.js"></script>
</body>
</html>
